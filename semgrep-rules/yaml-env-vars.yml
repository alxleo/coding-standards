rules:
  - id: coding-standards.unexpanded-env-var-in-yaml
    message: >
      YAML value contains ${VAR} that won't be expanded by most
      YAML-consuming tools. Use envsubst, the tool's native env
      mechanism, or inject the value at runtime.
    languages: [yaml]
    severity: WARNING
    patterns:
      - pattern-regex: '(?<!\$)\$\{[A-Z_][A-Z0-9_]*\}'
      # Gatus runs os.ExpandEnv over the raw file before parsing it, and its
      # README documents ${VAR} in the config as the way to take secrets
      # (config/config.go; "Use environment variables in config files").
      # A file is Gatus's own config when it has a top-level `endpoints:`
      # list whose entries carry `conditions:`. A ServiceMonitor's nested
      # `endpoints:` is not at the left margin, so it is still flagged.
      - pattern-not-inside:
          pattern-regex: '(?s)\A(?=.*^endpoints:[ \t]*\n)(?=.*^[ \t-]+conditions:).*\z'
    paths:
      include:
        - "*.yml"
        - "*.yaml"
      exclude:
        - "**/docker-compose*.yml"
        - "**/compose*.yml"
        - "**/.github/**"
        - "**/docker-action/**"
        - "**/dags/**"
        - "**/semgrep-rules/**"
        - "**/.mega-linter-default.yml"
        - "**/.mega-linter*.yml"
