name: Stock lint

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label compatible with the selected runtime
        required: true
        type: string
      runtime:
        description: Execution runtime (per-linter or image)
        default: per-linter
        type: string
      source-ref:
        description: Optional fixed source ref for a full scan
        type: string
      consumer-config:
        description: Existing MegaLinter policy to preserve the consumer's blocking checks in the per-linter runtime
        type: string
      semgrep-config:
        description: Optional repository-relative Semgrep rule file for a separate local-rule scan
        type: string
      semgrep-pr-scope:
        description: Auto uses changed files plus explicit targets for eligible local rules. Full checks the whole tree.
        default: auto
        type: string
      semgrep-targets:
        description: Optional newline-separated Git pathspecs for tracked files to pass as explicit Semgrep targets
        type: string
      cache-namespace:
        description: Optional isolated cache scope for a paired scan
        default: default
        type: string
      apply-fixes:
        description: MegaLinter APPLY_FIXES selection
        default: none
        type: string
      ephemeral:
        description: Permit Actions cache on an ephemeral self-hosted runner
        default: false
        type: boolean
  pull_request:
    paths:
      - .github/workflows/stock-lint.yml
      - renovate.json
      - build-assets.yml
      - stock/**

permissions:
  contents: read

jobs:
  stock:
    strategy:
      fail-fast: false
      matrix:
        runtime: ${{ fromJSON(inputs.runner == '' && '["image","per-linter"]' || inputs.runtime == 'image' && '["image"]' || '["per-linter"]') }}
    runs-on: ${{ inputs.runner || (matrix.runtime == 'per-linter' && 'ubuntu-24.04-arm' || 'ubuntu-24.04') }}
    timeout-minutes: ${{ matrix.runtime == 'per-linter' && 35 || 20 }}
    container: ${{ matrix.runtime == 'image' && 'ghcr.io/oxsecurity/megalinter-cupcake:v10.2.0@sha256:0e62d95de2e4388530579e1cdf531e3752ac70549ab78666c64429bd734dbae7' || '' }}
    steps:
      - name: Check out policy at the workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # actionlint 1.7.12 predates the workflow identity fields in the job context.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          path: policy
          persist-credentials: false
          sparse-checkout: |
            stock
            lint-configs
            semgrep-rules
            policies/compose
      # The pinned policy checkout supplies this workspace path.
      - uses: ./policy/stock # zizmor: ignore[self-repository]
        with:
          runtime: ${{ inputs.runtime || matrix.runtime }}
          source-ref: ${{ inputs.source-ref }}
          consumer-config: ${{ inputs.consumer-config }}
          semgrep-config: ${{ inputs.semgrep-config }}
          semgrep-pr-scope: ${{ inputs.semgrep-pr-scope || 'auto' }}
          semgrep-targets: ${{ inputs.semgrep-targets }}
          cache-namespace: ${{ inputs.cache-namespace || 'default' }}
          apply-fixes: ${{ inputs.apply-fixes || 'none' }}
          advisory: ${{ inputs.runner == '' }}
          ephemeral: ${{ inputs.ephemeral }}
          smoke: ${{ inputs.runner == '' }}
  stock-contract:
    if: github.event_name == 'pull_request' && inputs.runner == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            tools: uv node npm:renovate
          - runner: ubuntu-24.04-arm
            tools: uv
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          version: 2026.10.23
          working_directory: stock
          install_args: ${{ matrix.tools }}
          cache: false
      - name: Verify scanner and dependency contracts
        env:
          STOCK_RENOVATE: ${{ matrix.runner == 'ubuntu-24.04' }}
          MISE_AUTO_INSTALL: "false"
        working-directory: stock
        run: mise exec -- uv run --project .. --extra test python -m pytest tests/test_contract.py -q --durations=2
