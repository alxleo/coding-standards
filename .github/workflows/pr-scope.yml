name: Pull request scope

on:
  workflow_call:
    inputs:
      runner:
        description: Linux runner label for the scope check
        default: ubuntu-latest
        type: string
      package-readme:
        description: Optional repository-relative README required for package metadata
        default: ""
        type: string
    outputs:
      markdown-only:
        description: True when a pull request changes at least one file and all changed paths end in .md (case-insensitive).
        value: ${{ jobs.classify.outputs.markdown-only }}

permissions:
  contents: read

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 5
    outputs:
      markdown-only: >-
        ${{ steps.changes.outputs.markdown == 'true' && steps.changes.outputs.other == 'false' &&
            (inputs.package-readme == '' || steps.package-readme.outputs.valid == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Identify the base of the tested merge
        id: merge-base
        shell: bash
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          base="$(git rev-parse HEAD^1)"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Classify changed paths
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ""
          base: ${{ steps.merge-base.outputs.sha }}
          filters: |
            markdown: '**/*.[mM][dD]'
            other: '!**/*.[mM][dD]'
      - name: Check package README
        id: package-readme
        if: inputs.package-readme != '' && steps.changes.outputs.markdown == 'true' && steps.changes.outputs.other == 'false'
        shell: bash
        env:
          PACKAGE_README: ${{ inputs.package-readme }}
        run: |
          if [ -f "$PACKAGE_README" ] && iconv -f UTF-8 -t UTF-8 < "$PACKAGE_README" > /dev/null; then
            echo "valid=true" >> "$GITHUB_OUTPUT"
          else
            echo "The package README is missing or invalid. Running full validation."
          fi
